[web_providers]
default_max_concurrency = 3

[web_providers.tavily]
enable_search = true
enable_fetch = true
api_url = "https://api.tavily.com"
api_key_env = "TAVILY_API_KEY"

[web_providers.firecrawl]
enable_search = true
enable_fetch = true
api_url = "https://api.firecrawl.dev"
api_key_env = "FIRECRAWL_API_KEY"

[web_providers.exa]
enable_search = true
enable_fetch = true
api_url = "https://api.exa.ai"
api_key_env = "EXA_API_KEY"

[web_providers.linkup]
enable_search = true
enable_fetch = true
api_url = "https://api.linkup.so"
api_key_env = "LINKUP_API_KEY"

[web_providers.brave]
enable_search = true
enable_fetch = false
api_url = "https://api.search.brave.com"
api_key_env = "BRAVE_API_KEY"

[web_providers.anysearch]
enable_search = true
enable_fetch = false
api_url = "https://api.anysearch.com"
api_key_env = "ANYSEARCH_API_KEY"

[web_providers.tinyfish]
enable_search = true
enable_fetch = true
search_api_url = "https://api.search.tinyfish.ai"
fetch_api_url = "https://api.fetch.tinyfish.ai"
api_key_env = "TINYFISH_API_KEY"

[web_providers.parallel]
enable_search = true
enable_fetch = true
api_url = "https://api.parallel.ai"
api_key_env = "PARALLEL_API_KEY"
mode = "turbo"

[web_providers.parallel.search_fetch_policy]
max_age_seconds = 3600
timeout_seconds = 15
disable_cache_fallback = false

[web_providers.parallel.extract_fetch_policy]
max_age_seconds = 600
timeout_seconds = 30
disable_cache_fallback = true

[web_providers.brightdata]
enable_search = true
enable_fetch = true
api_url = "https://api.brightdata.com"
api_key_env = "BRIGHTDATA_API_KEY"
search_zone = "example_serp_zone"
fetch_zone = "example_unlocker_zone"

[web_providers.scrape_do]
# Search may return google.com/goto wrappers instead of destination URLs (issue #74).
# See README.md#known-provider-limitations; search can be disabled independently of fetch.
enable_search = true
enable_fetch = true
api_url = "https://api.scrape.do"
api_key_env = "SCRAPE_DO_API_KEY"

[web_providers.zenrows]
enable_search = false
enable_fetch = true
api_url = "https://api.zenrows.com"
api_key_env = "ZENROWS_API_KEY"

[web_providers.decodo]
enable_search = true
enable_fetch = true
api_url = "https://scraper-api.decodo.com"
api_key_env = "DECODO_API_KEY"

[web_providers.scrapingdog]
enable_search = true
enable_fetch = true
api_url = "https://api.scrapingdog.com"
api_key_env = "SCRAPINGDOG_API_KEY"

[web_providers.scrapegraphai]
enable_search = true
enable_fetch = true
api_url = "https://v2-api.scrapegraphai.com"
api_key_env = "SCRAPEGRAPH_AI_API_KEY"

[web_providers.scraperapi]
# Search may return google.com/goto wrappers instead of destination URLs (issue #74).
# See README.md#known-provider-limitations; search can be disabled independently of fetch.
enable_search = true
enable_fetch = true
api_url = "https://api.scraperapi.com"
api_key_env = "SCRAPER_API_KEY"

[web_providers.scrapingant]
enable_search = false
enable_fetch = true
api_url = "https://api.scrapingant.com"
api_key_env = "SCRAPINGANT_API_KEY"

[web_providers.serpapi]
enable_search = true
enable_fetch = false
api_url = "https://serpapi.com"
api_key_env = "SERP_API_KEY"

[web_providers.jina]
enable_search = false
enable_fetch = true
api_url = "https://r.jina.ai"

[academic_providers]
default_max_concurrency = 3

[academic_providers.arxiv]
enabled = true
api_url = "https://export.arxiv.org/api/query"

[academic_providers.semantic_scholar]
enabled = true
api_url = "https://api.semanticscholar.org/graph/v1"
# Optional:
# api_key_env = "SEMANTIC_SCHOLAR_API_KEY"

[academic_providers.openalex]
enabled = true
api_url = "https://api.openalex.org"
# Optional:
# contact_email_env = "OPENALEX_CONTACT_EMAIL"

[academic_providers.dblp]
enabled = true
api_url = "https://dblp.org/search/publ/api"

[academic_providers.crossref]
enabled = true
api_url = "https://api.crossref.org"
# Optional:
# contact_email_env = "CROSSREF_CONTACT_EMAIL"

[academic_providers.core]
enabled = true
api_url = "https://api.core.ac.uk/v3"
api_key_env = "CORE_API_KEY"

[oa_resolvers.unpaywall]
enabled = false
api_url = "https://api.unpaywall.org/v2"
# Required when enabled = true:
# contact_email_env = "UNPAYWALL_CONTACT_EMAIL"

[llm_providers]
default_max_concurrency = 2

[llm_providers.openai_main]
protocol = "openai"
api_endpoint = "chat_completions"
api_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
max_concurrency = 2

[global_default_llm]
provider = "openai_main"
model = "gpt-4o-mini"
extra_body = {}

[[search_llm.providers]]
provider = "openai_main"
model = "gpt-4o-mini"
extra_body = {}

[fetch_llm]
provider = "openai_main"
model = "gpt-4o-mini"
extra_body = {}

[fetch_llm.judge]
extra_body = {}

[fetch_llm.safety]
extra_body = {}

[fetch_llm.content_clean]
extra_body = {}

[fetch_llm.focus_summary]
extra_body = {}

[retry]
max_attempts = 3
base_delay_seconds = 0.25
max_delay_seconds = 2.0
request_timeout_seconds = 30.0
