[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-gateway"
version = "0.1.0"
description = "Local daemon and CLI for aggregated web and academic search plus admitted-URL fetching."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Dingxingdi" },
]
keywords = [
  "academic-search",
  "cli",
  "llm",
  "search",
  "web-search",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
agent-search-gateway = "agent_search_gateway.cli:main"

[project.urls]
Changelog = "https://github.com/Dingxingdi/agent-search-gateway/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Dingxingdi/agent-search-gateway#readme"
Homepage = "https://github.com/Dingxingdi/agent-search-gateway"
Issues = "https://github.com/Dingxingdi/agent-search-gateway/issues"
Repository = "https://github.com/Dingxingdi/agent-search-gateway.git"
Security = "https://github.com/Dingxingdi/agent-search-gateway/security/policy"

[dependency-groups]
dev = [
  "mypy>=1.11,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]
docs = [
  "pdoc>=16,<17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
