name: documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pages-status:
    name: Check whether Pages is enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read # required to query the repository's Pages configuration
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Detect Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; documentation deployment is skipped."
          fi

  build:
    name: Build Pages artifact
    if: ${{ needs.pages-status.outputs.enabled == 'true' }}
    needs: pages-status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # required by actions/configure-pages to read Pages settings
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Sync locked documentation environment
        run: uv sync --locked --all-groups
      - name: Build documentation
        run: uv run python scripts/build_docs.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: ${{ needs.pages-status.outputs.enabled == 'true' }}
    needs: [pages-status, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # required for OIDC authentication to GitHub Pages
      pages: write # required to publish the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
